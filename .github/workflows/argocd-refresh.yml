name: Force Argo CD refresh

# Argo CD's own repo-poll interval is ~3min, so a merge here can sit
# un-synced for a while otherwise. This forces every Application to
# hard-refresh immediately via an SSM tunnel to the controller -- no
# public exposure of argocd-server, see RUNBOOK.md's Observability
# section for the tradeoff discussion.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::829808296287:role/dck-argocd-sync-ci
          aws-region: us-east-1

      - name: Install session-manager-plugin
        run: |
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Fetch kubeconfig
        run: |
          aws ssm get-parameter --name /dck/prod/kubeconfig --with-decryption \
            --query Parameter.Value --output text > kubeconfig
          # The stored parameter is the raw admin kubeconfig pointing at
          # the controller's public IP on 6443 -- not reachable, the
          # apiserver has no public ingress at all. Rewrite it to go
          # through the SSM tunnel opened in the next step instead. That
          # tunnel's cert doesn't cover 127.0.0.1, hence skip-tls-verify
          # -- which kubectl refuses to combine with a
          # certificate-authority-data field also being present, so that
          # has to go too (same shape as the operator's own local
          # kubeconfig, which has neither).
          sed -i \
            -e '/certificate-authority-data:/d' \
            -e 's#server: https://[^[:space:]]*:6443#server: https://127.0.0.1:16443#' \
            -e '/server:/a\    insecure-skip-tls-verify: true' \
            kubeconfig

      - name: Open SSM tunnel to controller
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=dcomforters-kitchen" \
                      "Name=tag:Role,Values=controller" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Controller instance: $INSTANCE_ID"
          aws ssm start-session --target "$INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["6443"],"localPortNumber":["16443"]}' &
          # Give the tunnel a moment to establish before kubectl uses it.
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/16443) 2>/dev/null && break
            sleep 2
          done

      - name: Hard-refresh every Argo CD Application
        env:
          KUBECONFIG: kubeconfig
        run: |
          # Deliberately not `for app in $(...)` -- a failed command
          # substitution there doesn't trip `set -e`, so a dead cluster
          # connection would silently iterate zero times and this step
          # would report success having refreshed nothing (exactly what
          # happened on the first live run: a connection timeout was
          # masked as a clean pass). Capture it and check explicitly.
          apps="$(kubectl get applications -n argocd -o jsonpath='{.items[*].metadata.name}')"
          if [ -z "$apps" ]; then
            echo "::error::kubectl couldn't reach the cluster (or there are no Applications) -- see the previous steps' logs"
            exit 1
          fi
          for app in $apps; do
            echo "Refreshing $app"
            kubectl patch application "$app" -n argocd --type merge \
              -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}'
          done
