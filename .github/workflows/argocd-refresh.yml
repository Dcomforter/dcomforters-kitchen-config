name: Force Argo CD refresh

# Argo CD's own repo-poll interval is ~3min, so a merge here can sit
# un-synced for a while otherwise. This forces every Application to
# hard-refresh immediately via an SSM tunnel to the controller -- no
# public exposure of argocd-server, see RUNBOOK.md's Observability
# section for the tradeoff discussion.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::829808296287:role/dck-argocd-sync-ci
          aws-region: us-east-1

      - name: Install session-manager-plugin
        run: |
          curl -s "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Fetch kubeconfig
        run: |
          aws ssm get-parameter --name /dck/prod/kubeconfig --with-decryption \
            --query Parameter.Value --output text > kubeconfig

      - name: Open SSM tunnel to controller
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=dcomforters-kitchen" \
                      "Name=tag:Role,Values=controller" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Controller instance: $INSTANCE_ID"
          aws ssm start-session --target "$INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["6443"],"localPortNumber":["16443"]}' &
          # Give the tunnel a moment to establish before kubectl uses it.
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/16443) 2>/dev/null && break
            sleep 2
          done

      - name: Hard-refresh every Argo CD Application
        env:
          KUBECONFIG: kubeconfig
        run: |
          for app in $(kubectl get applications -n argocd -o jsonpath='{.items[*].metadata.name}'); do
            echo "Refreshing $app"
            kubectl patch application "$app" -n argocd --type merge \
              -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}'
          done
