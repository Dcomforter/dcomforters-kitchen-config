# Lean config to match infrastructure/prometheus/values.yaml — see the
# comment there re: no dynamic storage provisioning on this cluster.
# Dashboards/config are not persisted across pod restarts.
replicas: 1

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

# Placeholder domain, same as apps/dcomforters/base/ingress.yaml — needs a
# local hosts-file entry pointing at a worker EIP until real DNS exists.
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - grafana.dcomforters.yourdomain.com
  tls:
    - secretName: grafana-tls-secret
      hosts:
        - grafana.dcomforters.yourdomain.com
